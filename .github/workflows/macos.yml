  name: CI macOS (Homebrew + Clang)

  on:
    push:
      branches: ["main", "develop"]
    pull_request:
      branches: ["main", "develop"]
    workflow_dispatch:

  env:
   CMAKE_GENERATOR: Ninja
   INSTALL_PREFIX: "/Users/runner/local"

  jobs:
    build:
      runs-on: macos-latest
      timeout-minutes: 30

      strategy:
        matrix:
          build-type: [Release, Debug]
          include:
            - build-type: Release
              preset: release-homebrew
            - build-type: Debug
              preset: debug-homebrew

      steps:
        # ====================================================================
        # Checkout
        # ====================================================================
        - name: Checkout repository
          uses: actions/checkout@v4
          with:
            submodules: recursive
            fetch-depth: 0

        # ====================================================================
        # Install dependencies via Homebrew
        # ====================================================================
        - name: Install Homebrew dependencies
          run: |
            brew update
            brew install ccache

            brew list --versions ccache

        # ====================================================================
        # Setup ccache
        # ====================================================================
        - name: Setup ccache
          uses: hendrikmuhs/ccache-action@v1.2
          with:
            key: macos-ccache-${{ matrix.build-type }}
            max-size: "200M"

      # ====================================================================
      # Setup Qt
      # ====================================================================
        - name: Setup Qt 6.10.2 Environment
          uses: jurplel/install-qt-action@v4 
          with:
           version: '6.10.2'
           target: 'desktop'
           host: 'mac'

        # ====================================================================
        # Configure cmake environment
        # ====================================================================
        - name: Configure CMake
          run: |
           TESTS_FLAG="-Dtests=OFF"

           if [ -d "tests" ] && [ "$(ls -A tests 2>/dev/null)" ]; then
             TESTS_FLAG="-Dtests=ON"
             echo "::notice file=tests::the directory 'tests' exists and is not empty. Tests enabled."
           else
             echo "::warning file=tests::the directory 'tests' is empty or missing. Tests disabled (Tests:OFF)."
           fi

           cmake \
           --preset ${{ matrix.preset }} \
           -Ddesktop_ui=ON \
           ${TESTS_FLAG} \
           -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}
          shell: bash

        # ====================================================================
        # Build
        # ====================================================================
        - name: Build Project
          run: |
           cmake --build build/${{ matrix.preset }} --config ${{ matrix.build-type }} --parallel $(sysctl -n hw.ncpu)
          shell: bash

        # ====================================================================
        # Test
        # ====================================================================
        - name: Run Tests
          run: |
           cd build/${{ matrix.preset }}
           ctest --output-on-failure -C ${{ matrix.build-type }}
          shell: bash

        # ====================================================================
        # Upload build artifacts
        # ====================================================================
        - name: Upload build artifacts
          if: always()
          uses: actions/upload-artifact@v4
          with:
           name: build-macos-${{ matrix.build-type }}
           path: |
             build/${{ matrix.preset }}/qt/desktop/*.dmg
             build/${{ matrix.preset }}/qt/desktop/*.app
           retention-days: 7
           if-no-files-found: warn
